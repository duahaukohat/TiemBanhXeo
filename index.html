<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tiệm Bánh Xèo</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="game">

    <h1>🥞 Tiệm Bánh Xèo</h1>


    <div class="status">

        <span>
            💰 <span id="money">500</span>đ
        </span>

        <span>
            ⭐ Lv.1
        </span>

    </div>


    <!-- KHÁCH -->

    <div class="shop">

        <div class="shop-name">
            🏪 TIỆM BÁNH XÈO
        </div>


        <div class="customer-area">

            <div class="customer" id="customer">
                🐱
            </div>


            <div class="speech-bubble">

                <div id="orderText">
                    Cho mình order
                </div>

            </div>

        </div>


        <div class="waiting">

            Khách chờ:
            <span id="waitTime">60</span>s

            <div class="wait-progress">

                <div
                    class="wait-bar"
                    id="waitBar">
                </div>

            </div>

        </div>

    </div>


    <!-- BẾP -->

    <div class="kitchen">

        <h2 id="stage">
            Chuẩn bị làm bánh
        </h2>


        <div class="pan" id="pan">
            🍳
        </div>


        <div class="ingredients">


            <button
                onclick="addIngredient('🥞')">

                🥞
                <br>
                Bột

            </button>


            <button
                onclick="addIngredient('🦐')">

                🦐
                <br>
                Tôm

            </button>


            <button
                onclick="addIngredient('🥩')">

                🥩
                <br>
                Thịt

            </button>


            <button
                onclick="addIngredient('🦑')">

                🦑
                <br>
                Mực

            </button>


            <button
                onclick="addIngredient('🥬')">

                🥬
                <br>
                Giá

            </button>


        </div>


        <button
            class="main-button"
            id="action"
            onclick="nextStep()">

            🥞 ĐỔ BỘT

        </button>


        <div class="progress">

            <div
                class="bar"
                id="bar">
            </div>

        </div>


        <div
            class="message"
            id="message">

            Khách đang chờ món!

        </div>

    </div>

</div>


<script src="game.js"></script>

</body>

</html>
