<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tiệm Bánh Xèo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

    <h1>🥞 Tiệm Bánh Xèo</h1>

    <div class="status">
        <span>💰 <span id="money">500</span>đ</span>
        <span>⭐ Lv.1</span>
    </div>


    <!-- TIỆM -->

    <div class="shop">

        <div class="shop-name">
            🏪 TIỆM BÁNH XÈO
        </div>

        <div class="customer" id="customer">
            🐱
        </div>

        <div class="table"></div>

    </div>


    <!-- ORDER -->

    <div class="order">

        <div class="order-title">
            📝 ORDER
        </div>

        🥞 1 bánh xèo<br>
        🦐 Tôm<br>
        🥩 Thịt<br>
        🥬 Giá

    </div>


    <!-- BẾP -->

    <div class="kitchen">

        <h2 id="stage">
            Khách đang đến...
        </h2>


        <div class="pan" id="pan">
            🍳
        </div>


        <div class="ingredients">

            <button onclick="addIngredient('🥞')">
                🥞<br>Bột
            </button>

            <button onclick="addIngredient('🦐')">
                🦐<br>Tôm
            </button>

            <button onclick="addIngredient('🥩')">
                🥩<br>Thịt
            </button>

            <button onclick="addIngredient('🥬')">
                🥬<br>Giá
            </button>

            <button onclick="addIngredient('🌿')">
                🌿<br>Rau
            </button>

            <button onclick="addIngredient('🥣')">
                🥣<br>Nước chấm
            </button>

        </div>


        <button
            class="main-button"
            id="action"
            onclick="nextStep()">

            👋 ĐÓN KHÁCH

        </button>


        <div class="progress">

            <div
                class="bar"
                id="bar">
            </div>

        </div>


        <div
            class="message"
            id="message">

            Có khách đang bước vào tiệm!

        </div>

    </div>

</div>


<script src="game.js"></script>

</body>
</html>
